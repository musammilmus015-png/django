{% extends "base.html" %}

{% block title %}Delete prediction | Heartwise{% endblock %}

{% block content %}
<section class="container auth-section py-5">
  <div class="auth-card mx-auto">
    <p class="eyebrow">RECORD MANAGEMENT</p>
    <h1 class="h2 fw-bold">Delete this record?</h1>
    <p class="text-secondary">Prediction #{{ prediction.pk }} and its patient input will be permanently deleted from your history.</p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <button class="btn btn-danger" type="submit">Delete record</button>
        <a class="btn btn-outline-secondary" href="{% url 'prediction_history' %}">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
